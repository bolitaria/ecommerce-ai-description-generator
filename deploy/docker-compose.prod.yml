services:
  backend:
    image: ghcr.io/your-username/ecommerce-ai-description-generator/backend:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_URL=${OPENAI_URL}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}
      - ENV=production
      - DB_PATH=/app/data/store.db
    volumes:
      - prod-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/your-username/ecommerce-ai-description-generator/frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  prod-data:
