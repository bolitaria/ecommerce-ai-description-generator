# ==============================================================================
# Global values shared by all sub-charts.
# ==============================================================================
global:
  # Image registry + tag. Override per-environment in values-dev/prod.
  imageRegistry: ghcr.io/bolitaria/ecommerce-ai-description-generator
  imageTag: latest
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

  # Common environment.
  environment: production

# ==============================================================================
# Ingress
# ==============================================================================
ingress:
  enabled: true
  className: nginx
  host: ecommerce-ai.local
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# ==============================================================================
# Secrets — DO NOT commit real values.
#
# For local dev, values-dev.yaml overrides these with dummy values.
# For production, use SOPS-encrypted values or External Secrets Operator.
# ==============================================================================
secrets:
  internalApiToken: ""
  jwtSecret: ""
  databaseUrl: ""
  redisUrl: "redis://redis:6379"
  deepseekApiKey: ""
  deepseekUrl: "https://api.deepseek.com/v1"
  deepseekModel: "deepseek-chat"
  groqApiKey: ""
  geminiApiKey: ""
  openrouterApiKey: ""

# ==============================================================================
# Datastores (Postgres, Redis)
# For dev: plain Deployments in the umbrella. For prod: replace with a managed
# service (Cloud SQL, RDS, ElastiCache) or an operator (CloudNativePG).
# ==============================================================================
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    username: user
    password: pass
    database: store
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 1Gi

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ==============================================================================
# Sub-chart toggles. Actual values live in the sub-chart values.yaml, and are
# overridden here (or in values-dev/prod.yaml) as needed.
# ==============================================================================
core-api:
  enabled: true

ai-service:
  enabled: true

frontend:
  enabled: true

# ==============================================================================
# Alerting
# ==============================================================================
alertmanager:
  # Webhook receiver URL. In local dev, httpbin.org echoes back.
  # In production, override with a real Slack/PagerDuty webhook.
  webhookURL: "https://httpbin.org/post"

# ==============================================================================
# Alerting thresholds
# ==============================================================================
# Tunable thresholds for PrometheusRule alerts. Adjust per environment
# (values-dev vs values-prod) without touching the rule templates.
alerts:
  http:
    # 5xx error rate above this fraction triggers HighErrorRate.
    # SRE book recommends 5% for high-traffic services, 1% for critical SLOs.
    errorRateThreshold: 0.05
    # p95 latency threshold per service. ai-service talks to LLMs (1-5s),
    # core-api is DB-backed (<500ms), frontend serves static (<100ms).
    latencyP95Thresholds:
      core-api: 0.5
      ai-service: 5.0
      frontend: 0.2
  ai:
    # Provider error rate above this fraction triggers AIProviderHighErrorRate.
    providerErrorRateThreshold: 0.10
    # Fallback rate as a fraction of total requests (not absolute).
    fallbackRateThreshold: 0.10
  kubernetes:
    # Container restarts in 15 minutes before alerting.
    crashLoopRestartsThreshold: 3
  # Certificate expiry: warn X days before expiration.
  certificates:
    expiryDaysWarning: 14
    expiryDaysCritical: 7
  # PVC usage: warn when disk usage exceeds this fraction.
  pvc:
    usageThreshold: 0.80
