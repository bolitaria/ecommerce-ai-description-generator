apiVersion: v2
name: ecommerce-ai
description: E-commerce AI platform — umbrella chart
type: application
version: 0.1.0
appVersion: "1.0.0"
icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/kubernetes/icon/color/kubernetes-icon-color.svg

dependencies:
  - name: common
    version: 0.1.0
    repository: file://../charts/common
    alias: common

  - name: core-api
    version: 0.1.0
    repository: file://charts/core-api
    condition: core-api.enabled

  - name: ai-service
    version: 0.1.0
    repository: file://charts/ai-service
    condition: ai-service.enabled

  - name: frontend
    version: 0.1.0
    repository: file://charts/frontend
    condition: frontend.enabled
