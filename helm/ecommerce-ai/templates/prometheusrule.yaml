{{/*
PrometheusRule with SLO-based alerts for the ecommerce-ai platform.
Discovered by the Prometheus Operator via the `release: kps` label.

Thresholds are configurable in values.yaml under `alerts.*`.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    release: kps
spec:
  groups:
    - name: ecommerce-ai.http
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum by (app) (rate(http_requests_total{status=~"5.."}[5m]))
              /
              sum by (app) (rate(http_requests_total[5m]))
            ) > {{ .Values.alerts.http.errorRateThreshold }}
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: High 5xx error rate on {{`{{ $labels.app }}`}}
            description: |
              {{`{{ $labels.app }}`}} is returning more than
              {{ .Values.alerts.http.errorRateThreshold | mul 100 }}% 5xx errors
              for the last 5 minutes (current: {{`{{ $value | humanizePercentage }}`}}).
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#higherrorrate

        {{- range $svc, $threshold := .Values.alerts.http.latencyP95Thresholds }}
        - alert: HighLatencyP95_{{ $svc }}
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{app="{{ $svc }}"}[5m])
              )
            ) > {{ $threshold }}
          for: 5m
          labels:
            severity: warning
            team: platform
            app: {{ $svc }}
          annotations:
            summary: High p95 latency on {{ $svc }}
            description: |
              p95 latency on {{ $svc }} is above {{ $threshold }}s
              for the last 5 minutes (current: {{`{{ $value | humanizeDuration }}`}}).
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#highlatencyp95
        {{- end }}

        - alert: TrafficDrop
          expr: |
            (
              sum by (app) (rate(http_requests_total[5m]))
              < 0.2 * sum by (app) (rate(http_requests_total[5m] offset 1d))
            )
            and
            (sum by (app) (rate(http_requests_total[5m] offset 1d)) > 0)
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: Traffic drop on {{`{{ $labels.app }}`}}
            description: |
              {{`{{ $labels.app }}`}} is receiving less than 20% of yesterday's
              traffic at the same time, for 15 minutes.
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#trafficdrop

    - name: ecommerce-ai.ai
      interval: 30s
      rules:
        - alert: AIProviderTotalOutage
          expr: |
            (
              sum(rate(ai_provider_requests_total{status="success"}[5m]))
              == 0
            )
            and
            (
              sum(rate(ai_provider_requests_total[5m])) > 0
            )
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: All AI providers are failing
            description: |
              The AI fallback chain is receiving requests but no provider
              is returning success. Every user request is failing with 500.
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#aiprovidertotaloutage

        - alert: AIProviderHighErrorRate
          expr: |
            (
              sum by (provider) (rate(ai_provider_requests_total{status="error"}[5m]))
              /
              sum by (provider) (rate(ai_provider_requests_total[5m]))
            ) > {{ .Values.alerts.ai.providerErrorRateThreshold }}
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: AI provider {{`{{ $labels.provider }}`}} error rate is high
            description: |
              Provider {{`{{ $labels.provider }}`}} has a failure rate above
              {{ .Values.alerts.ai.providerErrorRateThreshold | mul 100 }}% for 15 minutes.
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#aiproviderhigherrorrate

        - alert: AIProviderFallbackStorm
          expr: |
            (
              sum by (from, to) (rate(ai_provider_fallbacks_total[5m]))
              /
              sum(rate(ai_provider_requests_total[5m]))
            ) > {{ .Values.alerts.ai.fallbackRateThreshold }}
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: High fallback rate from {{`{{ $labels.from }}`}} to {{`{{ $labels.to }}`}}
            description: |
              More than {{ .Values.alerts.ai.fallbackRateThreshold | mul 100 }}% of
              requests are falling back from {{`{{ $labels.from }}`}} to {{`{{ $labels.to }}`}}
              for 10 minutes.
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#aiproviderfallbackstorm

    - name: ecommerce-ai.kubernetes
      interval: 30s
      rules:
        - alert: KubeDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}"}
            !=
            kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}"}
          for: 10m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: Deployment {{`{{ $labels.deployment }}`}} has unavailable replicas
            description: |
              Deployment {{`{{ $labels.deployment }}`}} has replicas unavailable
              for 10 minutes. More reliable than PodNotReady because it does
              not fire during normal rolling updates.
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#kubedeploymentreplicasmismatch

        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[15m]) > {{ .Values.alerts.kubernetes.crashLoopRestartsThreshold }}
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: Pod {{`{{ $labels.pod }}`}} is crash-looping
            description: |
              Pod {{`{{ $labels.pod }}`}} has restarted more than
              {{ .Values.alerts.kubernetes.crashLoopRestartsThreshold }}
              times in 15 minutes.
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#podcrashlooping

        - alert: HPAAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="{{ .Release.Namespace }}"}
            >=
            kube_horizontalpodautoscaler_spec_max_replicas{namespace="{{ .Release.Namespace }}"}
          for: 30m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: HPA {{`{{ $labels.horizontalpodautoscaler }}`}} at max replicas
            description: |
              The HPA for {{`{{ $labels.horizontalpodautoscaler }}`}} has been at
              max replicas for 30 minutes.
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#hpaatmaxreplicas

    - name: ecommerce-ai.infrastructure
      interval: 30s
      rules:
        - alert: PVCUsageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="{{ .Release.Namespace }}"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="{{ .Release.Namespace }}"}
            ) > {{ .Values.alerts.pvc.usageThreshold }}
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: PVC {{`{{ $labels.persistentvolumeclaim }}`}} is {{`{{ $value | humanizePercentage }}`}} full
            description: |
              PVC {{`{{ $labels.persistentvolumeclaim }}`}} is above
              {{ .Values.alerts.pvc.usageThreshold | mul 100 }}% capacity for 10 minutes.
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#pvcusagehigh

        - alert: KubeNodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: Node {{`{{ $labels.node }}`}} is not ready
            description: |
              Node {{`{{ $labels.node }}`}} has been NotReady for 5 minutes.
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#kubenodenotready

        - alert: CertificateExpiringSoon
          expr: |
            (
              certmanager_certificate_expiration_timestamp_seconds
              -
              time()
            ) < {{ .Values.alerts.certificates.expiryDaysWarning }} * 86400
          for: 1h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: Certificate {{`{{ $labels.name }}`}} expires soon
            description: |
              Certificate {{`{{ $labels.name }}`}} expires in less than
              {{ .Values.alerts.certificates.expiryDaysWarning }} days.
            runbook_url: https://github.com/bolitaria/ecommerce-ai-description-generator/blob/main/docs/runbook.md#certificateexpiringsoon
