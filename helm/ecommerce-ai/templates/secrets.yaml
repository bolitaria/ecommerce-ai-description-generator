{{/*
One Secret holding all env vars consumed by the sub-charts.
Sub-charts reference it by name via `envFrom.secretRef.name` using
the `common.secretName` helper.

⚠️  In production, DO NOT fill these from plain values.yaml. Use:
    - SOPS-encrypted values files (recommended for this project), or
    - External Secrets Operator pointed at a cloud secrets manager.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  # --- Shared internal config ---
  ENV: {{ .Values.global.environment | quote }}
  INTERNAL_API_TOKEN: {{ .Values.secrets.internalApiToken | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}

  # --- Datastores ---
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}

  # --- AI providers (consumed by the ai-service only) ---
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  DEEPSEEK_URL: {{ .Values.secrets.deepseekUrl | quote }}
  DEEPSEEK_MODEL: {{ .Values.secrets.deepseekModel | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
