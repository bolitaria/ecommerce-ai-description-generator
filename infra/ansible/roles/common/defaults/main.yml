---
# Default variables for the common role.
# Override in playbook.yml or group_vars if needed.

common_timezone: "Europe/Madrid"

# Base packages installed on every host.
common_base_packages:
  - tzdata
  - curl
  - ca-certificates
  - gnupg
  - apt-transport-https
  - git
  - vim
  - htop
  - jq
  - unzip

# Disable swap (required by k3s / Kubernetes).
common_disable_swap: true
