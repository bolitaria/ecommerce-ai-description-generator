---
# Test playbook: only the common role.
# Validates the role against a Docker container before touching a real VM.
#
# Usage (from infra/ansible/):
#   docker run -d --name ansible-test --platform linux/amd64 ubuntu:22.04 sleep infinity
#   docker exec ansible-test apt update -qq && docker exec ansible-test apt install -y -qq python3
#   ansible-playbook -i tests/inventory-docker.yml tests/test-common.yml
#   docker rm -f ansible-test

- name: Test common role
  hosts: ansible-test
  become: true
  gather_facts: true

  roles:
    - common
