---
# Ansible collection dependencies.
#
# Install into the project (portable):
#   ansible-galaxy collection install -r requirements.yml -p ./collections
#
# The ansible.cfg in this directory includes ./collections in
# collections_paths, so ansible-lint and ansible-playbook find them
# automatically.
#
# Version note: this project runs on ansible-core 2.16.x, which requires
# community.general 8.x. Bump both together when upgrading ansible-core.

collections:
  - name: community.general
    version: ">=8.0.0,<9.0.0"
